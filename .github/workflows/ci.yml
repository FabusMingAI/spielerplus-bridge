name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r spielerplus_mcp/requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q spielerplus_mcp custom_components tests
      - name: Run tests
        run: pytest -q
      - name: Scan for private ICS credentials
        run: |
          python - <<'PYSCAN'
          from pathlib import Path
          import re

          pattern = re.compile(r'spielerplus[.]de/events/ics[?]t=([A-Za-z0-9_-]+)&u=([A-Za-z0-9_-]+)')
          allowed = {'EXAMPLE', 'PRIVATE', 'DEIN_TOKEN'}
          offenders = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in {'.py', '.md', '.json', '.yml', '.example'}:
                  continue
              for first, second in pattern.findall(path.read_text(errors='ignore')):
                  if first not in allowed or second not in allowed:
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('Potential ICS credentials in: ' + ', '.join(sorted(set(offenders))))
          PYSCAN
