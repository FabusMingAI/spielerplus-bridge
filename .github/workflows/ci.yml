name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r spielerplus_mcp/requirements.txt pytest pyyaml
      - name: Validate repository metadata and docs
        run: python scripts/validate_repository.py
      - name: Compile source
        run: python -m compileall -q spielerplus_mcp custom_components tests tests_ha scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Scan for private ICS credentials
        run: |
          python - <<'PYSCAN'
          from pathlib import Path
          import re

          pattern = re.compile(r'spielerplus[.]de/events/ics[?]t=([A-Za-z0-9_-]+)&u=([A-Za-z0-9_-]+)')
          allowed = {'EXAMPLE', 'PRIVATE', 'DEIN_TOKEN'}
          offenders = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in {'.py', '.md', '.json', '.yml', '.example'}:
                  continue
              for first, second in pattern.findall(path.read_text(errors='ignore')):
                  if first not in allowed or second not in allowed:
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('Potential ICS credentials in: ' + ', '.join(sorted(set(offenders))))
          PYSCAN

  homeassistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test inside Home Assistant 2026.10.1
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/custom_components:/config/custom_components:ro" \
            -v "$PWD/tests_ha:/tests:ro" \
            ghcr.io/home-assistant/home-assistant:2026.10.1 \
            -c 'python -m pip install "icalendar>=6,<8" "recurring-ical-events>=3,<5" && python /tests/test_runtime.py'
