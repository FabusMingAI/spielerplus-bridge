name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r spielerplus_mcp/requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q spielerplus_mcp custom_components tests
      - name: Run tests
        run: pytest -q
      - name: Scan for private ICS credentials
        run: |
          python - <<'PYSCAN'
          import pathlib, re
          offenders = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix not in {'.py', '.md', '.json', '.yml', '.example'}:
                  continue
              data = p.read_text(errors='ignore')
              for m in re.finditer(r'spielerplus\\.de/events/ics\\?t=([^&\\s"\\']+)&u=([^&\\s"\\']+)', data):
                  if any(x not in {'EXAMPLE', 'PRIVATE', 'DEIN_TOKEN'} for x in m.groups()):
                      offenders.append(str(p))
          if offenders:
              raise SystemExit('Potential ICS credentials in: ' + ', '.join(offenders))
          PYSCAN
